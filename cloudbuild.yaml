substitutions:
  _PROJECT_ID: "voltaic-cocoa-154400"

options:
  logsBucket: gs://$_PROJECT_ID-cloudbuild-logs

serviceAccount: cloudbuild-trigger-sa@$_PROJECT_ID.iam.gserviceaccount.com

steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['echo', 'Hello']

  - id: 'branch name'
    name: 'alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
          echo "***********************"
          echo "${BRANCH_NAME}"
          echo "***********************"

# [START tf-init]
  - id: 'tf init'
    name: 'hashicorp/terraform:1.9.8'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
          if [ -d "environments/$BRANCH_NAME/" ]; then
            cd environments/$BRANCH_NAME
            terraform init
          else
            for dir in environments/*/
            do
              cd "$dir"
              env=${dir%*/}
              env=${env#*/}
              echo ""
              echo "*************** TERRAFORM INIT ******************"
              echo "******* At environment: ${env} ********"
              echo "*************************************************"
              terraform init || exit 1
              cd ../../
            done
          fi
# [END tf-init]

# [START tf-plan]
  - id: 'tf plan'
    name: 'hashicorp/terraform:1.9.8'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
          if [ -d "environments/$BRANCH_NAME/" ]; then
            cd environments/$BRANCH_NAME
            terraform plan
          else
            for dir in environments/*/
            do
              cd "$dir"
              env=${dir%*/}
              env=${env#*/}
              echo ""
              echo "*************** TERRAFORM PLAN ******************"
              echo "******* At environment: ${env} ********"
              echo "*************************************************"
              terraform plan || exit 1
              cd ../../
            done
          fi
# [END tf-plan]

# [START tf-apply]
  - id: 'tf apply'
    name: 'hashicorp/terraform:1.9.8'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
          if [ -d "environments/$BRANCH_NAME/" ]; then
            cd environments/$BRANCH_NAME
            terraform apply -auto-approve
          else
            echo "***************************** SKIPPING APPLYING *******************************"
            echo "Branch '$BRANCH_NAME' does not represent an official environment."
            echo "*******************************************************************************"
          fi
# [END tf-apply]
